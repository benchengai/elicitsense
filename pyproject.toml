[project]
name = "elicitsense"
version = "0.1.0"
description = "Meeting recordings to an evidence-linked requirements register, with uncertainty cues."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.80",
    "faster-whisper>=1.1",
    "openai>=2",
    "pydantic>=2.7",
]

[project.scripts]
elicitsense = "elicitsense.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
